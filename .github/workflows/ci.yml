name: CI

# Pull requests get the full quality gate but never publish an image.
# Pushes to main additionally build, scan, publish, and open a deployment PR
# against the config repo.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch. Three pushes in five minutes
# should not mean three full pipelines competing for runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; jobs opt into more.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_BACKEND: ghcr.io/${{ github.repository_owner }}/url-shortener-backend
  IMAGE_FRONTEND: ghcr.io/${{ github.repository_owner }}/url-shortener-frontend

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate. Fast, and it runs first — no point building an image for code
  # that does not pass its own tests.
  # ---------------------------------------------------------------------------
  test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    services:
      # A real Postgres, not SQLite. The local suite runs on SQLite for speed;
      # this job is what catches the divergence between the two — which has
      # already bitten us once, on BigInteger autoincrement.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shortener
          POSTGRES_PASSWORD: shortener
          POSTGRES_DB: shortener_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shortener -d shortener_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Sync dependencies
        working-directory: backend
        # --frozen fails if uv.lock is out of date with pyproject.toml, rather
        # than silently re-resolving. A lockfile that CI ignores is not a lockfile.
        run: uv sync --frozen --group dev

      - name: Ruff (lint)
        working-directory: backend
        run: uv run ruff check --output-format=github .

      - name: Ruff (format)
        working-directory: backend
        run: uv run ruff format --check .

      - name: mypy (strict)
        working-directory: backend
        run: uv run mypy app

      - name: pytest against Postgres
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://shortener:shortener@localhost:5432/shortener_test
        run: uv run pytest --cov-report=xml --cov-report=term-missing

      - name: Verify Alembic migrations apply cleanly
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://shortener:shortener@localhost:5432/shortener_test
        # Upgrade, then downgrade, then upgrade again. A migration that cannot be
        # rolled back is a migration you cannot safely deploy — and this catches
        # a missing downgrade() long before an incident does.
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: backend/coverage.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Build, scan, publish. Depends on `test`, so a red suite blocks everything.
  # ---------------------------------------------------------------------------
  build:
    name: Build, scan, push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      # Required to upload SARIF results to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU
        # Emulation for cross-architecture builds. The runner is amd64; this is
        # what lets it produce arm64 layers too — which matters because the dev
        # machine is an Apple Silicon Mac while AKS nodes are amd64. Without a
        # multi-arch image, one of the two gets "exec format error".
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/url-shortener-${{ matrix.service }}
          # The SHA tag is the only one that is truly immutable and is what the
          # config repo pins. Branch and semver tags are conveniences for humans.
          tags: |
            type=sha,format=long,prefix=
            type=ref,event=branch
            type=semver,pattern=v{{version}}
            type=raw,value=dev,enable={{is_default_branch}}

      # Build to a local image first, WITHOUT pushing, so Trivy can inspect it.
      # Scanning after publishing would mean a vulnerable image was briefly
      # available to pull — the gate has to come before the push, not after.
      - name: Build for scanning (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: scan-target:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-{0}', github.run_number) }}
            GIT_SHA=${{ github.sha }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          # Only report vulnerabilities that actually have a fix available.
          # Un-fixable CVEs in a base image cannot be actioned, and failing on
          # them trains people to ignore the scanner — which is worse than not
          # scanning at all.
          ignore-unfixed: true
          exit-code: "0" # report here; the gate is the next step

      - name: Upload scan results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # THIS is the gate. Non-zero exit fails the job and the image never
          # reaches the registry.
          exit-code: "1"

      - name: Log in to GHCR
        # Only after the scan passes, and never on pull requests — a PR from a
        # fork must not be able to publish.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # Automatically provided; no PAT to create or rotate.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build multi-arch and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            APP_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('0.1.0-{0}', github.run_number) }}
            GIT_SHA=${{ github.sha }}
          # Signed provenance attestation — proves which workflow, from which
          # commit, produced this image. This is the supply-chain answer to
          # "how do you know that image is what you think it is?"
          provenance: mode=max
          sbom: true

  # ---------------------------------------------------------------------------
  # The seam between CI and GitOps: open a PR against the config repo.
  # ---------------------------------------------------------------------------
  promote:
    name: Open deployment PR
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v5
        with:
          repository: ${{ github.repository_owner }}/url-shortener-config
          # A cross-repo write needs a token with access to that repo; the
          # default GITHUB_TOKEN is scoped to this one only. A fine-grained PAT
          # (contents: write, pull-requests: write on the config repo) stored as
          # CONFIG_REPO_TOKEN is the least-privilege option.
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          path: config

      - name: Pin dev overlay to this commit
        working-directory: config
        run: |
          cd overlays/dev
          # kustomize edit rewrites the images: block properly rather than
          # sed-ing YAML, which would break the first time formatting changed.
          curl -sSfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          ./kustomize edit set image \
            ghcr.io/${{ github.repository_owner }}/url-shortener-backend=:${{ github.sha }} \
            ghcr.io/${{ github.repository_owner }}/url-shortener-frontend=:${{ github.sha }}
          rm -f kustomize

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          path: config
          token: ${{ secrets.CONFIG_REPO_TOKEN }}
          branch: deploy/dev-${{ github.sha }}
          commit-message: "deploy(dev): ${{ github.sha }}"
          title: "deploy(dev): ${{ github.sha }}"
          body: |
            Automated deployment PR.

            | | |
            |---|---|
            | Commit | ${{ github.sha }} |
            | Author | @${{ github.actor }} |
            | Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |

            Tests, type checks, and a Trivy HIGH/CRITICAL scan all passed before
            these images were published.

            Merging this makes ArgoCD sync the dev environment.
          labels: automated, deployment
