# nginx config for the frontend container.
#
# Two jobs: serve three static files, and reverse-proxy everything the app
# cannot handle itself to the backend. Doing the proxy here rather than calling
# the backend directly from JavaScript means the browser sees a single origin —
# no CORS preflight, no backend hostname baked into the frontend image, and the
# same image works in Compose and Kubernetes because only BACKEND_HOST changes.

# Run as an unprivileged user. The nginx:alpine image ships an `nginx` user for
# exactly this; binding to 8080 rather than 80 is what makes it possible, since
# ports below 1024 require CAP_NET_BIND_SERVICE.
pid /tmp/nginx.pid;

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Everything nginx wants to write goes somewhere a non-root user can write.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # JSON access logs to stdout. Structured because Stage 6 ships these to
    # Loki, and parsing a bespoke text format there is wasted effort.
    log_format json escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"method":"$request_method","uri":"$request_uri","status":$status,'
      '"bytes":$body_bytes_sent,"duration":$request_time,'
      '"upstream_time":"$upstream_response_time","referer":"$http_referer",'
      '"user_agent":"$http_user_agent"}';

    access_log /dev/stdout json;
    error_log  /dev/stderr warn;

    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 512;

    # Resolved at startup from the environment via envsubst (see entrypoint in
    # the Dockerfile). "backend" under Compose, a Service DNS name in Kubernetes.
    upstream api {
        server ${BACKEND_HOST}:${BACKEND_PORT};
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Basic hardening. Not a substitute for a real CSP review, but these are
        # the cheap ones and their absence shows up in any security scan.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # The frontend's own liveness endpoint. Must not proxy to the backend —
        # nginx being healthy and the backend being healthy are separate facts,
        # and conflating them would restart the frontend whenever the API blips.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # /api/* -> backend, prefix PRESERVED.
        #
        # Note the missing trailing slash on proxy_pass. With `http://api/` nginx
        # replaces the matched "/api/" with "/", so /api/links would arrive at
        # the backend as /links — which does not exist, and would instead be
        # swallowed by the catch-all redirect route and 404. Without the slash,
        # the original URI is passed through untouched. This one character is a
        # classic nginx trap.
        location /api/ {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }

        # Caching policy, and the reasoning matters because getting it wrong
        # here silently breaks the deploy demo.
        #
        # This project has no build step, so filenames are NOT content-hashed —
        # it is always style.css, never style.a1b2c3.css. Without a hash in the
        # name, a far-future max-age means a deployed change stays invisible
        # until the TTL expires. (Learned the direct way: a 5-minute max-age
        # here made a CSS fix appear not to have deployed at all.)
        #
        # `no-cache` is the right setting for unversioned assets. It does not
        # mean "do not cache" — it means "revalidate before use", so the browser
        # still gets a cheap 304 when nothing changed, but always sees a deploy
        # immediately. If this ever grows a build step with hashed filenames,
        # flip these to `public, max-age=31536000, immutable`.
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        location ~* \.(css|js)$ {
            add_header Cache-Control "no-cache";
        }

        # Anything else that looks like a short code goes to the backend, which
        # owns the redirect. This is last so it cannot shadow the rules above.
        location / {
            try_files $uri $uri/ @backend;
        }

        location @backend {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
