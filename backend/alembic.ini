[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped filenames so migrations sort chronologically in the directory
# listing and merge conflicts are obvious rather than silent.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# NOTE: no sqlalchemy.url here on purpose. The connection string is a secret in
# every environment that matters, so it is read from DATABASE_URL at runtime in
# alembic/env.py. A committed credential is a committed credential even if it is
# "only" the dev one.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
