[project]
name = "url-shortener"
version = "0.1.0"
description = "URL shortener — demo application for a DevOps delivery pipeline"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.7",
    # --- observability -------------------------------------------------------
    # RED metrics (rate, errors, duration) with almost no code.
    "prometheus-fastapi-instrumentator>=7.0",
    # Tracing. The OTLP exporter talks the vendor-neutral OpenTelemetry
    # protocol, so swapping Jaeger for Tempo or a hosted backend later is a
    # config change rather than a code change — which is the entire point of
    # instrumenting with OTel rather than a vendor SDK.
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "opentelemetry-instrumentation-logging>=0.50b0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C4", "S", "RET", "ARG"]
# S101 = assert used. Fine in tests, which is the only place we use it.
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001"]
"alembic/*" = ["N999", "ARG001"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: requires a live Postgres (skipped when DATABASE_URL is unset)",
]

[tool.coverage.run]
omit = ["app/observability/*", "alembic/*"]
